# Dev stack. Paths are relative to this file (infra/docker/), so the repo root
# is ../../ . Invoke from the repo root with:
#
#   docker compose -f infra/docker/docker-compose.yml up --build
#
# (scripts/start-all.{sh,ps1} do this for you.)
#
# Secrets/overrides come from a .env next to this file or via --env-file:
#   POSTGRES_PASSWORD, REDIS_URL, AUTH_USE_HTTPS, FRONTEND_ORIGIN,
#   GATEWAY_ALLOW_SELF_SIGNED, VITE_AUTH_URL. See ../../.env.example.

services:
  redis:
    image: redis:7-alpine
    container_name: meetai-redis
    # Do not bind Redis to the host port to avoid conflicts with a host Redis instance.
    # Other containers can still reach Redis at hostname `redis:6379`.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-service:
    build:
      # Context is the pnpm workspace root; the Dockerfile lives in the package.
      context: ../../server
      dockerfile: auth/Dockerfile
    command: node src/server.js
    env_file:
      - ../../server/.env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: postgresql://meetai:${POSTGRES_PASSWORD:-meetai_pass}@postgres:5432/meetai_dev
      # Lightning.ai terminates TLS at the edge; internal traffic is plain HTTP.
      AUTH_USE_HTTPS: "false"
    # Cert volumes removed — Lightning.ai handles TLS externally.
    ports:
      - "4020:4020"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://0.0.0.0:4020/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    develop:
      watch:
        - action: sync+restart
          path: ../../server/auth
          target: /workspace/auth
          ignore:
            - node_modules/
        - action: rebuild
          path: ../../server/auth/package.json
    restart: unless-stopped

  meeting-service:
    build:
      context: ../../server
      dockerfile: meetings/Dockerfile
    command: node src/server.js
    env_file:
      - ../../server/.env
    environment:
      DATABASE_URL: postgresql://meetai:${POSTGRES_PASSWORD:-meetai_pass}@postgres:5432/meetai_dev
      QA_SERVICE_URL: http://qa-service:8100
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://5173-01ktkf3mffk9c5m6q2tvfyhjs4.cloudspaces.litng.ai}
    # ports:
    #   - "4001:4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://0.0.0.0:4001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    develop:
      watch:
        - action: sync+restart
          path: ../../server/meetings
          target: /workspace/meetings
          ignore:
            - node_modules/
        - action: rebuild
          path: ../../server/meetings/package.json
    depends_on:
      postgres:
        condition: service_healthy
      qa-service:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ../../server
      dockerfile: gateway/Dockerfile
    command: node src/app.js
    env_file:
      - ../../server/.env
    environment:
      AUTH_SERVICE_URL: http://auth-service:4020
      MEETING_SERVICE_URL: http://meeting-service:4001
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_SERVICE_WS_URL: ws://ai-gateway:8000/asr
      QA_SERVICE_URL: http://qa-service:8100
      DATABASE_URL: postgresql://meetai:${POSTGRES_PASSWORD:-meetai_pass}@postgres:5432/meetai_dev
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://5173-01ktkf3mffk9c5m6q2tvfyhjs4.cloudspaces.litng.ai}
      GATEWAY_ALLOW_SELF_SIGNED: "false"
    ports:
      - "4010:4010"
    # Cert volumes removed — gateway talks to all upstreams over plain HTTP.
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      meeting-service:
        condition: service_healthy
      ai-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://0.0.0.0:4010/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    develop:
      watch:
        - action: sync+restart
          path: ../../server/gateway
          target: /workspace/gateway
          ignore:
            - node_modules/
        - action: rebuild
          path: ../../server/gateway/package.json
    restart: unless-stopped

  ai-gateway:
    build:
      context: ../../ai
      # Slim, no-CUDA image — the gateway imports no ML libraries.
      dockerfile: Dockerfile.gateway
    command: python3 -m aiengine.gateway.service
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NUM_WORKERS: 1
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://0.0.0.0:8000/health', timeout=3).getcode()==200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  embedder:
    build:
      context: ../../ai
      dockerfile: Dockerfile
      args:
        REQUIREMENTS: requirements/embedder.txt
    command: python3 -m aiengine.embedder
    environment:
      LOG_LEVEL: INFO
      EMBEDDER_PORT: 8200
      EMBEDDINGS_PREFER_LOCAL: "true"
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
      TRANSFORMERS_CACHE: /root/.cache/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: /root/.cache/huggingface/sentence_transformers
      TORCH_HOME: /root/.cache/huggingface/torch
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8200:8200"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import json,urllib.request,sys; data=json.load(urllib.request.urlopen('http://0.0.0.0:8200/health', timeout=3)); sys.exit(0 if data.get('model_loaded') else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ai-worker:
    build:
      context: ../../ai
      dockerfile: Dockerfile
      args:
        # Full ASR/diarization stack — the worker runs the audio pipeline.
        REQUIREMENTS: requirements/worker.txt
    command: python3 -m aiengine.worker
    env_file:
      - ../../ai/.env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: postgresql://meetai:${POSTGRES_PASSWORD:-meetai_pass}@postgres:5432/meetai_dev
      EMBED_SERVICE_URL: http://embedder:8200
      NUM_WORKERS: 1
      WORKER_ID: 0
      DIARIZATION_ENABLED: "true"
      LOG_LEVEL: INFO
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    depends_on:
      redis:
        condition: service_healthy
      embedder:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  qa-service:
    build:
      context: ../../ai
      dockerfile: Dockerfile
      args:
        # Retrieval + Gemini + HTTP embedder; no ASR/diarization stack.
        REQUIREMENTS: requirements/qa.txt
    command: python3 -m uvicorn aiengine.qa.service:app --host 0.0.0.0 --port 8100
    env_file:
      - ../../ai/.env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: postgresql://meetai:${POSTGRES_PASSWORD:-meetai_pass}@postgres:5432/meetai_dev
      EMBED_SERVICE_URL: http://embedder:8200
    depends_on:
      postgres:
        condition: service_healthy
      embedder:
        condition: service_healthy
    # No GPU — qa-service only orchestrates HTTP calls (Gemini + embedder).
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://0.0.0.0:8100/health', timeout=3).getcode()==200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ../../client/web
      dockerfile: Dockerfile.dev
    command: pnpm run dev -- --host 0.0.0.0 --port 5173
    environment:
      CHOKIDAR_USEPOLLING: "true"
      HOST: 0.0.0.0
      VITE_AUTH_URL: ${VITE_AUTH_URL:-https://4010-01ktkf3mffk9c5m6q2tvfyhjs4.cloudspaces.litng.ai}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://5173-01ktkf3mffk9c5m6q2tvfyhjs4.cloudspaces.litng.ai}                                        
      VITE_AUTH_USE_HTTPS: "false"
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ../../client/web/src
          target: /app/src
        - action: sync
          path: ../../client/web/public
          target: /app/public
        - action: rebuild
          path: ../../client/web/package.json
    depends_on:
      gateway:
        condition: service_healthy
    # Cert volumes removed — web runs over plain HTTP; Lightning.ai handles HTTPS externally.
    restart: unless-stopped

  postgres:
    build:
      context: ../../infra/db/postgres
      dockerfile: Dockerfile
    container_name: meetai-postgres
    environment:
      POSTGRES_USER: meetai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetai_pass}
      POSTGRES_DB: meetai_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  pgdata:
  hf-cache:
