services:
  redis:
    image: redis:7-alpine
    container_name: meetai-redis
    # Do not bind Redis to the host port to avoid conflicts with a host Redis instance.
    # Other containers can still reach Redis at hostname `redis:6379`.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node auth-service/index.js
    environment:
      AUTH_PORT: 4020
      FRONTEND_ORIGIN: http://localhost:5173
      REDIS_URL: redis://redis:6379
      JWT_SECRET: meetai_dev_secret
      JWT_TTL_SECONDS: 20
      REFRESH_TTL_SECONDS: 864000
      NODE_ENV: development
    ports:
      - "4020:4020"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4020/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  meeting-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node meeting-service/index.js
    environment:
      PORT: 4001
      NODE_ENV: development
    ports:
      - "4001:4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node gateway/app.js
    environment:
      GATEWAY_PORT: 4010
      FRONTEND_ORIGIN: http://localhost:5173
      AUTH_SERVICE_URL: http://auth-service:4020
      MEETING_SERVICE_URL: http://meeting-service:4001
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    ports:
      - "4010:4010"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      meeting-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4010/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./client/meetai-web
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      CHOKIDAR_USEPOLLING: "true"
      HOST: 0.0.0.0
    ports:
      - "5173:5173"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    build:
      context: ./server/db/postgres
      dockerfile: Dockerfile
    container_name: meetai-postgres
    environment:
      POSTGRES_USER: meetai
      POSTGRES_PASSWORD: meetai_pass
      POSTGRES_DB: meetai_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata: