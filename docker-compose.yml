services:
  redis:
    image: redis:7-alpine
    container_name: meetai-redis
    # Do not bind Redis to the host port to avoid conflicts with a host Redis instance.
    # Other containers can still reach Redis at hostname `redis:6379`.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node auth-service/index.js
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://meetai:meetai_pass@postgres:5432/meetai_dev
    ports:
      - "4020:4020"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4020/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    develop:
      watch:
        - action: sync+restart
          path: ./server
          target: /app
          ignore:
            - node_modules/
            - db/postgres/
        - action: rebuild
          path: ./server/package.json
    restart: unless-stopped

  meeting-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node meeting-service/index.js
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://meetai:meetai_pass@postgres:5432/meetai_dev
    ports:
      - "4001:4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    develop:
      watch:
        - action: sync+restart
          path: ./server
          target: /app
          ignore:
            - node_modules/
            - db/postgres/
        - action: rebuild
          path: ./server/package.json
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node gateway/app.js
    env_file:
      - ./server/.env
    environment:
      AUTH_SERVICE_URL: http://auth-service:4020
      MEETING_SERVICE_URL: http://meeting-service:4001
      REDIS_URL: redis://redis:6379
    ports:
      - "4010:4010"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      meeting-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4010/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    develop:
      watch:
        - action: sync+restart
          path: ./server
          target: /app
          ignore:
            - node_modules/
            - db/postgres/
        - action: rebuild
          path: ./server/package.json
    restart: unless-stopped

  web:
    build:
      context: ./client/meetai-web
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      CHOKIDAR_USEPOLLING: "true"
      HOST: 0.0.0.0
      VITE_AUTH_URL: http://localhost:4010
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./client/meetai-web/src
          target: /app/src
        - action: sync
          path: ./client/meetai-web/public
          target: /app/public
        - action: rebuild
          path: ./client/meetai-web/package.json
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    build:
      context: ./server/db/postgres
      dockerfile: Dockerfile
    container_name: meetai-postgres
    environment:
      POSTGRES_USER: meetai
      POSTGRES_PASSWORD: meetai_pass
      POSTGRES_DB: meetai_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  pgdata:
