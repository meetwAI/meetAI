name: meetai

x-app-build: &app-build
  context: ..
  dockerfile: deploy/Dockerfile

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  NUM_WORKERS: ${NUM_WORKERS:-1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  EMBED_SERVICE_URL: http://embedder:8200

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: *app-build
    command: ["python3", "-m", "src.app.server"]
    restart: unless-stopped
    environment:
      <<: *common-env
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: *app-build
    command: ["python3", "-m", "src.app.worker"]
    restart: unless-stopped
    environment:
      <<: *common-env
      WORKER_ID: ${WORKER_ID:-0}
    depends_on:
      redis:
        condition: service_healthy

  embedder:
    build: *app-build
    # Start the server in the background, wait for it to be accessible,
    # hit the warmup endpoint, and then wait for the server process.
    command: >
      sh -c "python3 -m src.embedder &
      while ! curl -s http://localhost:8200/health > /dev/null; do sleep 1; done;
      curl -X POST http://localhost:8200/warmup;
      wait"
    restart: unless-stopped
    environment:
      <<: *common-env
      EMBEDDER_PORT: 8200
    ports:
      - "8200:8200"

  qa:
    build: *app-build
    command: ["python3", "-m", "src.qa"]
    restart: unless-stopped
    environment:
      <<: *common-env
      QA_PORT: 8100
      DATABASE_URL: ${DATABASE_URL:-postgresql://meetai:meetai_pass@postgres:5432/meetai_dev}
    ports:
      - "8100:8100"
